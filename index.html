<div id="loginPopup" class="popup hidden">
    <div class="login-box">
        <span id="closeButton">&times;</span>

        <div class="tabs">
            <button type="button" class="tab-btn active" data-target="loginForm">Login</button>
            <button type="button" class="tab-btn" data-target="registerForm">Register</button>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" method="POST" action="login.php">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required>
                <button type="button" id="togglePassword">&#128065;</button>
            </div>

            <button type="submit">Login</button>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" method="POST" action="register.php" class="hidden">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" required>

            <label for="jenisKelamin">Jenis Kelamin:</label>
            <select id="jenisKelamin" name="jenis_kelamin" required>
                <option value="">-- Pilih --</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>

            <label for="tanggalLahir">Tanggal Lahir:</label>
            <input type="date" id="tanggalLahir" name="tanggal_lahir" required>

            <label for="regUsername">Username:</label>
            <input type="text" id="regUsername" name="username" required>

            <label for="regPassword">Password:</label>
            <div class="password-wrapper">
                <input type="password" id="regPassword" name="password" required>
                <button type="button" id="toggleRegPassword" aria-label="Tampilkan password" aria-controls="regPassword" aria-pressed="false">&#128065;</button>
            </div>

            <label for="regKonfirmasi">Konfirmasi Password:</label>
            <input type="password" id="regKonfirmasi" name="konfirmasi" required>

            <label for="cariProvinsi">Provinsi:</label>
            <div class="region-picker" id="pickerProvinsi">
                <input type="search" id="cariProvinsi" class="region-search" placeholder="Pilih atau cari provinsi..." aria-label="Pilih atau cari provinsi" aria-haspopup="listbox" aria-expanded="false" aria-controls="opsiProvinsi" autocomplete="off" disabled>
                <div id="opsiProvinsi" class="region-options" role="listbox" hidden></div>
            </div>
            <select id="provinsi" name="provinsi" class="region-native-select" tabindex="-1" aria-hidden="true" disabled>
                <option value="">-- Pilih Provinsi --</option>
            </select>
            <small id="errorProvinsi" class="error-text region-error" aria-live="polite"></small>

            <label for="cariKabupaten">Kabupaten/Kota:</label>
            <div class="region-picker" id="pickerKabupaten">
                <input type="search" id="cariKabupaten" class="region-search" placeholder="Pilih atau cari kabupaten/kota..." aria-label="Pilih atau cari kabupaten/kota" aria-haspopup="listbox" aria-expanded="false" aria-controls="opsiKabupaten" autocomplete="off" disabled>
                <div id="opsiKabupaten" class="region-options" role="listbox" hidden></div>
            </div>
            <select id="kabupaten" name="kabupaten" class="region-native-select" tabindex="-1" aria-hidden="true" disabled>
                <option value="">-- Pilih Kabupaten/Kota --</option>
            </select>
            <small id="errorKabupaten" class="error-text region-error" aria-live="polite"></small>

            <label for="cariKecamatan">Kecamatan:</label>
            <div class="region-picker" id="pickerKecamatan">
                <input type="search" id="cariKecamatan" class="region-search" placeholder="Pilih atau cari kecamatan..." aria-label="Pilih atau cari kecamatan" aria-haspopup="listbox" aria-expanded="false" aria-controls="opsiKecamatan" autocomplete="off" disabled>
                <div id="opsiKecamatan" class="region-options" role="listbox" hidden></div>
            </div>
            <select id="kecamatan" name="kecamatan" class="region-native-select" tabindex="-1" aria-hidden="true" disabled>
                <option value="">-- Pilih Kecamatan --</option>
            </select>
            <small id="errorKecamatan" class="error-text region-error" aria-live="polite"></small>

            <label for="cariDesa">Desa/Kelurahan:</label>
            <div class="region-picker" id="pickerDesa">
                <input type="search" id="cariDesa" class="region-search" placeholder="Pilih atau cari desa/kelurahan..." aria-label="Pilih atau cari desa/kelurahan" aria-haspopup="listbox" aria-expanded="false" aria-controls="opsiDesa" autocomplete="off" disabled>
                <div id="opsiDesa" class="region-options" role="listbox" hidden></div>
            </div>
            <select id="desa" name="desa" class="region-native-select" tabindex="-1" aria-hidden="true" disabled>
                <option value="">-- Pilih Desa --</option>
            </select>
            <small id="errorDesa" class="error-text region-error" aria-live="polite"></small>

            <button type="submit">Daftar</button>
        </form>
    </div>
</div>
<script src="script.js?v=5"></script>
</body>
</html>
